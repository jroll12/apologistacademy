<template>
  <style>
    /*{{LIB}}*/
    /* a light animated grain over everything: breaks up banding in the dark gradients after YouTube's encode */
    #gr { position: absolute; inset: 0; background: url("assets/img/grain.png") repeat; background-size: 512px 512px; opacity: 0.032; pointer-events: none; }
  </style>
  <div id="root" data-composition-id="grain" data-width="1920" data-height="1080">
    <div id="gr"></div>
  </div>
  <script>
    (function () {
      const T = /*{{T}}*/ {};
      const tl = gsap.timeline({ paused: true });
      const n = Math.round(T.total * 30);
      // a new offset every frame (173 px, 311 px steps never line up with the 512 px tile)
      tl.fromTo("#gr", { backgroundPosition: "0px 0px" }, { backgroundPosition: `${n * 173}px ${n * 311}px`, duration: T.total, ease: `steps(${n})` }, 0);
      window.__timelines["grain"] = tl;
    })();
  </script>
</template>
