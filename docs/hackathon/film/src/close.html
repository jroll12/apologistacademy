<template>

  <script>
    (function () {
      const T = /*{{T}}*/ {};
      const tl = gsap.timeline({ paused: true });
      const reply = document.getElementById("cl-out").textContent;
      const text = document.getElementById("cl-text");
      const ph = document.getElementById("cl-ph");
      const send = document.getElementById("cl-send");
      const show = (s) => { text.textContent = s; ph.style.opacity = s ? 0 : 1; send.style.background = s ? "#7137FF" : "#374151"; };
      const cam = (fx, fy, s, px, py) => ({ x: px - s * fx, y: py - s * fy, scale: s });
      gsap.set(["#cl-out", "#cl-dots", "#cl-card", "#cl-mark", "#cl-name", "#cl-try", "#cl-url", "#cl-qrbox", "#cl-scan", "#cl-foot"], { opacity: 0 });
      // the same phone as the opening, the same framing (a hard cut after the dip)
      tl.set("#cl-phone-wrap", cam(950, 395, 1.95, 960, 540), 0);
      tl.fromTo("#cl-stage", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
      // down to the reply field, as in the opening; this time the reply gets written
      tl.to("#cl-phone-wrap", { ...cam(960, 834, 1.8, 960, 876), duration: 0.6, ease: "power2.inOut" }, 0.1);
      // this time a reply gets written, and sent
      const o = { n: 0 };
      const t0 = Math.max(T.type, 0.75);
      tl.to(o, { n: reply.length, duration: Math.max(1.2, T.send - t0 - 0.15), ease: "none", onUpdate: () => show(reply.slice(0, Math.round(o.n))) }, t0);
      tl.to(o, { n: 0, duration: 0.01, onUpdate: () => show(reply.slice(0, Math.round(o.n))) }, T.send);
      tl.fromTo("#cl-out", { opacity: 0, y: 30, scale: 0.9, transformOrigin: "100% 100%" }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.5)" }, T.send);
      // sent: back up to see the whole exchange
      tl.to("#cl-phone-wrap", { ...cam(950, 470, 1.32, 960, 520), duration: 0.75, ease: "power3.inOut" }, T.send + 0.05);
      tl.fromTo("#cl-dots", { opacity: 0, scale: 0.8, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, T.send + 1.0);
      tl.to("#cl-dots i", { y: -5, duration: 0.22, stagger: 0.1, yoyo: true, repeat: 5, ease: "sine.inOut" }, T.send + 1.15);
      // the end card: the phone steps left and stays, the name and the way in arrive beside it
      tl.to("#cl-phone-wrap", { ...cam(960, 480, 0.94, 410, 530), duration: 0.85, ease: "power3.inOut" }, T.card - 0.1);
      tl.set("#cl-card", { opacity: 1 }, T.card + 0.2);
      tl.fromTo("#cl-mark", { opacity: 0, scale: 0.4, rotate: -8 }, { opacity: 1, scale: 1, rotate: 0, duration: 0.6, ease: "back.out(1.7)" }, T.card + 0.25);
      tl.fromTo("#cl-name", { opacity: 0, x: -30, filter: "blur(8px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, T.card + 0.4);
      tl.fromTo(["#cl-try", "#cl-url"], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.12, ease: "expo.out" }, T.url - 0.15);
      tl.fromTo(["#cl-qrbox", "#cl-scan"], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.1, ease: "expo.out" }, T.url + 0.15);
      tl.fromTo("#cl-foot", { opacity: 0 }, { opacity: 1, duration: 0.5 }, T.url + 0.6);
      window.__timelines["close"] = tl;
    })();
  </script>
