<template>
  <style>
    /*{{LIB}}*/
    /* a light still dither over everything: breaks up banding in the dark gradients */
    #gr { position: absolute; inset: 0; background: url("assets/img/grain.png") repeat; background-size: 512px 512px; opacity: 0.032; pointer-events: none; }
  </style>
  <div id="root" data-composition-id="grain" data-width="1920" data-height="1080">
    <div id="gr"></div>
  </div>
  <script>
    (function () {
      const T = /*{{T}}*/ {};
      const tl = gsap.timeline({ paused: true });
      // a still dither, not animated: animated grain made every frame unique and the file ~50 Mb/s
      tl.set("#gr", { opacity: 0.028 }, 0);
      tl.set({}, {}, T.total);
      window.__timelines["grain"] = tl;
    })();
  </script>
</template>
