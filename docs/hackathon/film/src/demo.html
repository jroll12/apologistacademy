  <script>
    (function () {
      const T = /*{{T}}*/ {};
      const tl = gsap.timeline({ paused: true });
      // camera: put an app point (cx, cy) of the 390 x 844 screen at (TX, TY) on the frame, at scale s
      const SX = 314, SY = 62, K = 0.94, TX = 497, TY = 470;
      const pos = (cx, cy, s, tx) => {
        let y = TY - s * (SY + cy * K);
        const top = y + s * (SY - 14), bot = y + s * (SY + 844 * K + 14);
        if (bot - top > 1080) { if (top > 0) y -= top; else if (bot < 1080) y += 1080 - bot; }
        return { x: (tx || TX) - s * (SX + cx * K), y, scale: s };
      };
      T.cam.forEach(([t, cx, cy, s, d, tx], i) => {
        if (i === 0) tl.set("#dm-cam", pos(cx, cy, s, tx), 0);
        else tl.to("#dm-cam", { ...pos(cx, cy, s, tx), duration: d, ease: i === 1 ? "sine.inOut" : "power2.inOut" }, t);
      });
      tl.fromTo("#dm-stage", { scale: 0.86, opacity: 0, filter: "blur(12px)", transformOrigin: "26% 45%" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 0);

      const groups = ["#dm-pick", "#dm-sk", "#dm-talk", "#dm-coach", "#dm-pers", "#dm-rv", "#dm-rv2"];
      gsap.set(groups, { opacity: 0 });
      const groupIn = (id, t) => tl.fromTo(id, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, t);
      const groupOut = (id, t) => tl.to(id, { opacity: 0, filter: "blur(8px)", duration: 0.16 }, t);
      const land = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 26, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.38, ease: "expo.out" }, t);
      const lit = (sel, t) => {
        tl.to(sel, { color: "#FFFFFF", duration: 0.2 }, t);
        tl.to(`${sel} em, ${sel} i`, { backgroundColor: "#7137FF", borderColor: "#7137FF", color: "#FFFFFF", duration: 0.2 }, t);
      };
      gsap.set(["#dm-n16", "#dm-r8", "#dm-noacct", "#dm-p1", "#dm-p2", "#dm-p3", "#dm-diff", "#dm-speak", "#dm-answers", "#dm-tough", "#dm-own", "#dm-q", "#dm-debate", "#dm-person", "#dm-stamp", "#dm-print", "#dm-church"], { opacity: 0 });
      gsap.set(".dm-turns b", { scaleX: 0 });

      // 1 pick
      groupIn("#dm-pick", T.pickIn - 0.1);
      land("#dm-n16", T.q16 - 0.1);
      const n = { v: 1 };
      tl.fromTo(n, { v: 1 }, { v: 16, duration: 0.7, ease: "power2.out", onUpdate: () => { document.getElementById("dm-n16").textContent = Math.round(n.v); } }, T.q16 - 0.1);
      land("#dm-r8", T.t8 - 0.1);
      land("#dm-noacct", T.noAcct - 0.1);
      groupOut("#dm-pick", T.pickOut);
      // 2 skeptic
      groupIn("#dm-sk", T.who);
      land("#dm-p1", T.curious - 0.1);
      land("#dm-p2", T.hostile - 0.1);
      land("#dm-p3", T.hostile + 0.9);
      land("#dm-diff", T.set - 0.1);
      groupOut("#dm-sk", T.skOut);
      // 3 talk
      groupIn("#dm-talk", T.skOut + 0.2);
      tl.to(".dm-turns b", { scaleX: 1, duration: 0.25, stagger: 0.12, ease: "power2.out" }, T.turns);
      land("#dm-speak", T.speak - 0.6);
      land("#dm-answers", T.answers - 0.15);
      land("#dm-tough", T.tougher - 0.1);
      groupOut("#dm-talk", T.talkOut);
      // 4 coach
      groupIn("#dm-coach", T.stuck - 0.1);
      lit("#dm-s1", T.hint - 0.05);
      lit("#dm-s2", T.outline - 0.05);
      lit("#dm-s3", T.sample - 0.05);
      land("#dm-own", T.own - 0.3);
      groupOut("#dm-coach", T.coachOut);
      // while the phone moves to the centre, the label steps aside
      tl.to("#dm-tag", { opacity: 0, duration: 0.25 }, T.center);
      tl.to("#dm-tag", { opacity: 1, duration: 0.3 }, T.quote - 0.2);
      // 5 the personal answer (the skeptic's own words from the live run)
      groupIn("#dm-pers", T.quote - 0.2);
      land("#dm-q", T.quote - 0.1);
      land("#dm-debate", T.debate - 0.25);
      land("#dm-person", T.person - 0.15);
      groupOut("#dm-pers", T.personalOut);
      // 6 review
      groupIn("#dm-rv", T.review - 0.1);
      lit("#dm-c1", T.covered - 0.1);
      lit("#dm-c2", T.add - 0.1);
      lit("#dm-c3", T.verseW - 0.1);
      tl.fromTo("#dm-stamp", { opacity: 0, scale: 1.3, rotate: -4 }, { opacity: 1, scale: 1, rotate: -2, duration: 0.35, ease: "back.out(2)" }, T.scores - 0.1);
      groupIn("#dm-rv2", T.print - 0.2);
      land("#dm-print", T.print - 0.1);
      land("#dm-church", T.replace - 0.15);

      tl.to("#dm-stage", { scale: 0.9, opacity: 0, filter: "blur(12px)", duration: 0.3, ease: "power3.in", transformOrigin: "50% 50%" }, T.exit);
      window.__timelines["demo"] = tl;
    })();
