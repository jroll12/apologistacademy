      <div id="dm-col">

  <script>
    (function () {
      const T = /*{{T}}*/ {};
      const tl = gsap.timeline({ paused: true });
      // camera: put an app point (cx, cy) of the 390 x 844 screen at (TX, TY) on the frame, at scale s
      const SX = 314, SY = 62, K = 0.94, TX = 497, TY = 470;
      const pos = (cx, cy, s, tx) => {
        let y = TY - s * (SY + cy * K);
        const top = y + s * (SY - 14), bot = y + s * (SY + 844 * K + 14);
        if (bot - top > 1080) { if (top > 0) y -= top; else if (bot < 1080) y += 1080 - bot; }
        return { x: (tx || TX) - s * (SX + cx * K), y, scale: s };
      };
      T.cam.forEach(([t, cx, cy, s, d, tx], i) => {
        if (i === 0) tl.set("#dm-cam", pos(cx, cy, s, tx), 0);
        else tl.to("#dm-cam", { ...pos(cx, cy, s, tx), duration: d, ease: i === 1 ? "sine.inOut" : "power2.inOut" }, t);
        // the top-edge fade only while the phone is cropped by the frame
        if (i > 0) tl.to("#dm-fade", { opacity: s >= 1.25 ? 1 : 0, duration: d, ease: "power2.inOut" }, t);
      });
      // in from the title: the phone rises from below as the title lifts away
      tl.fromTo("#dm-phone", { y: 900 }, { y: 0, duration: 0.95, ease: "expo.out" }, 0);

      const groups = ["#dm-pick", "#dm-sk", "#dm-talk", "#dm-pair", "#dm-coach", "#dm-pers", "#dm-rv", "#dm-rv2"];
      gsap.set(groups, { opacity: 0 });
      gsap.set(["#dm-tag", "#dm-ask"], { opacity: 0 });
      const groupIn = (id, t) => tl.fromTo(id, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, t);
      const groupOut = (id, t) => tl.to(id, { opacity: 0, filter: "blur(8px)", duration: 0.16 }, t);
      const land = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 26, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.38, ease: "expo.out" }, t);
      const lit = (sel, t, dot = true) => {
        tl.to(sel, { color: "#FFFFFF", borderColor: "#7137FF", duration: 0.2 }, t);
        if (dot) tl.to(`${sel} i`, { backgroundColor: "#7137FF", duration: 0.2 }, t);
      };
      gsap.set(["#dm-r16", "#dm-r8", "#dm-noacct", "#dm-p1", "#dm-p2", "#dm-p3", "#dm-diff", "#dm-five", "#dm-q1", "#dm-pair-h", "#dm-you1", "#dm-sk1", "#dm-cq1", "#dm-cq3", "#dm-own", "#dm-pq", "#dm-debate", "#dm-person", "#dm-stamp", "#dm-print", "#dm-church"], { opacity: 0 });
      gsap.set(".dm-turns b", { scaleX: 0 });

      // the honesty line, once, while the app is first on screen
      tl.fromTo("#dm-tag", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.7);
      tl.to("#dm-tag", { opacity: 0, duration: 0.25 }, T.pickOut);

      // 1 pick
      groupIn("#dm-pick", T.pickIn - 0.1);
      land("#dm-r16", T.q16 - 0.1);
      const n = { v: 1 };
      tl.fromTo(n, { v: 1 }, { v: 16, duration: 0.7, ease: "power2.out", onUpdate: () => { document.getElementById("dm-n16").textContent = Math.round(n.v); } }, T.q16 - 0.1);
      land("#dm-r8", T.t8 - 0.1);
      land("#dm-noacct", T.noAcct - 0.1);
      groupOut("#dm-pick", T.pickOut);
      // 2 skeptic (this run: Balanced, Standard)
      groupIn("#dm-sk", T.who);
      land("#dm-p1", T.curious - 0.1);
      land("#dm-p2", T.hostile - 0.1);
      land("#dm-p3", T.hostile + 0.9);
      land("#dm-diff", T.set - 0.1);
      groupOut("#dm-sk", T.skOut);
      // 3 talk: five turns, then the skeptic's real opening line
      groupIn("#dm-talk", T.skOut + 0.2);
      land("#dm-five", T.turns - 0.2);
      tl.to(".dm-turns b", { scaleX: 1, duration: 0.25, stagger: 0.12, ease: "power2.out" }, T.turns);
      land("#dm-q1", Math.min(T.open, T.turns + 0.5));
      groupOut("#dm-talk", T.answers - 0.35);
      // 3b it answers what you said: your words, and the reply that picks them up
      groupIn("#dm-pair", T.answers - 0.2);
      land("#dm-pair-h", T.answers - 0.2);
      land("#dm-you1", T.answers);
      land("#dm-sk1", T.answers + 0.6);
      groupOut("#dm-pair", T.talkOut);
      // 4 coach: point at the button, then show what Coach actually says, step by step
      tl.fromTo("#dm-ask", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, T.coachTap - 0.9);
      tl.to("#dm-ask", { opacity: 0, duration: 0.2 }, T.coachTap + 0.5);
      groupIn("#dm-coach", T.stuck - 0.1);
      // one card per step, swapped in place
      const swap = (from, to, t) => {
        tl.to(from, { opacity: 0, filter: "blur(6px)", duration: 0.14 }, t - 0.14);
        tl.fromTo(to, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22 }, t);
      };
      // the hint is on the phone as soon as Coach opens, so its card comes early enough to read;
      // the outline only lights its step (on screen it would be too brief to read)
      land("#dm-cq1", T.stuck + 0.25);
      lit("#dm-s1", T.hint - 0.05, false);
      lit("#dm-s2", T.outline - 0.05, false);
      lit("#dm-s3", T.sample - 0.05, false);
      swap("#dm-cq1", "#dm-cq3", T.sample - 0.02);
      land("#dm-own", T.own - 0.3);
      groupOut("#dm-coach", T.coachOut);
      // 5 the personal answer: the phone (centred) steps back and the skeptic's words fill the frame
      tl.to("#dm-phone", { opacity: 0.22, duration: 0.4, ease: "power2.inOut" }, T.quote - 0.35);
      groupIn("#dm-pers", T.quote - 0.2);
      land("#dm-pq", T.quote - 0.1);
      land("#dm-debate", T.debate - 0.25);
      land("#dm-person", T.person - 0.15);
      groupOut("#dm-pers", T.personalOut);
      tl.to("#dm-phone", { opacity: 1, duration: 0.4, ease: "power2.inOut" }, T.personalOut);
      // 6 review
      groupIn("#dm-rv", T.review - 0.1);
      lit("#dm-c1", T.covered - 0.1);
      lit("#dm-c2", T.add - 0.1);
      lit("#dm-c3", T.verseW - 0.1);
      tl.fromTo("#dm-stamp", { opacity: 0, scale: 1.3, rotate: -4 }, { opacity: 1, scale: 1, rotate: -2, duration: 0.35, ease: "back.out(2)" }, T.scores - 0.1);
      groupOut("#dm-rv", T.print - 0.3);
      groupIn("#dm-rv2", T.print - 0.2);
      land("#dm-print", T.print - 0.1);
      land("#dm-church", T.replace - 0.15);
      // out: the text clears; the phone is back at full size for the match cut into the three screens
      groupOut("#dm-rv2", T.fin);
      window.__timelines["demo"] = tl;
    })();
  </script>
